name: demo-storage

on:
  push:
    branches: [master, ci/demo-verification]
  pull_request:
    branches: [master]
  schedule:
    - cron: '12 4 * * *' # Nightly at 04:12 UTC
  workflow_dispatch:

jobs:
  verify-storage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM and Z3
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang z3

      - name: Run Full Storage Pipeline (build + evidence + Z3 + effect lint)
        working-directory: demo/storage
        run: |
          bash build.sh

      - name: Upload Verification Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-verification-report
          path: |
            demo/storage/pcf-proof-report.json
            demo/storage/ips-report.json
            demo/storage/effect-lint-report.json
