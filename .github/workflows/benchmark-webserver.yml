name: benchmark-webserver

on:
  schedule:
    - cron: '53 5 * * *' # Nightly at 05:53 UTC
  workflow_dispatch:

jobs:
  k6-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps (k6, LLVM/Clang, jq)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates curl gnupg jq clang llvm lld
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -y
          sudo apt-get install -y k6

      - name: Build demo server
        working-directory: demo/webserver
        run: |
          bash build.sh

      - name: Run k6 scenarios
        working-directory: demo/webserver
        env:
          TARGET_URL: http://127.0.0.1:9090/
        run: |
          # start server in background
          ./alienstack-server >/tmp/alienstack-server.log 2>&1 &
          echo $! > /tmp/alienstack-server.pid
          trap 'kill $(cat /tmp/alienstack-server.pid) 2>/dev/null || true; echo "--- alienstack-server.log ---"; cat /tmp/alienstack-server.log || true' EXIT
          sleep 2

          cat > single.js <<'EOF'
          import http from 'k6/http';
          import { check } from 'k6';
          export const options = { vus: 1, duration: '10s' };
          const target = __ENV.TARGET_URL || 'http://127.0.0.1:9090/';
          export default function () {
            const res = http.get(target);
            check(res, { 'status 200': (r) => r.status === 200 });
          }
          EOF

          cat > steady.js <<'EOF'
          import http from 'k6/http';
          import { check } from 'k6';
          export const options = {
            scenarios: {
              steady_state: {
                executor: 'constant-arrival-rate',
                rate: 3000,
                timeUnit: '1s',
                duration: '10s',
                preAllocatedVUs: 200,
                maxVUs: 1000,
              },
            },
          };
          const target = __ENV.TARGET_URL || 'http://127.0.0.1:9090/';
          export default function () {
            const res = http.get(target);
            check(res, { 'status 200': (r) => r.status === 200 });
          }
          EOF

          k6 run --summary-export k6-single.json single.js
          k6 run --summary-export k6-steady.json steady.js

      - name: Print key metrics
        if: always()
        working-directory: demo/webserver
        run: |
          summarize() {
            local file=$1
            local label=$2
            if [ -f "$file" ]; then
              local rps=$(jq '.metrics.http_reqs.rate' "$file")
              local p95=$(jq '.metrics.http_req_duration["p(95)"]' "$file")
              echo "$label RPS: $rps"
              echo "$label p95 latency (s): $p95"
            fi
          }
          summarize k6-single.json "single"
          summarize k6-steady.json "steady_state"

      - name: Publish results to job summary
        if: always()
        working-directory: demo/webserver
        run: |
          {
            echo "## Webserver k6 benchmark results"
            echo ""
            echo "| Scenario | RPS | p95 latency | Checks passed | Checks failed |"
            echo "| --- | --- | --- | --- | --- |"
            for f in k6-single.json k6-steady.json; do
              [ -f "$f" ] || continue
              jq -r --arg name "$f" '"| \($name) | \(.metrics.http_reqs.rate // 0 | floor) | \(.metrics.http_req_duration["p(95)"] // 0) | \(.metrics.checks.passes // 0) | \(.metrics.checks.fails // 0) |"' "$f"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce regression gate
        working-directory: demo/webserver
        env:
          # Sanity floors — catch catastrophic regressions, not runner noise.
          MIN_SINGLE_RPS: "200"
          MIN_STEADY_RPS: "2000"
          MAX_CHECK_FAIL_RATIO: "0.01"
        run: |
          status=0
          gate() {
            local file=$1 min_rps=$2
            local rps passes fails total
            rps=$(jq '.metrics.http_reqs.rate // 0 | floor' "$file")
            passes=$(jq '.metrics.checks.passes // 0' "$file")
            fails=$(jq '.metrics.checks.fails // 0' "$file")
            total=$((passes + fails))
            if [ "$rps" -lt "$min_rps" ]; then
              echo "FAIL: $file rps=$rps below floor $min_rps"; status=1
            else
              echo "OK:   $file rps=$rps (floor $min_rps)"
            fi
            if [ "$total" -gt 0 ]; then
              if awk -v f="$fails" -v t="$total" -v m="$MAX_CHECK_FAIL_RATIO" 'BEGIN { exit !(f/t > m) }'; then
                echo "FAIL: $file check failures $fails/$total exceed ratio $MAX_CHECK_FAIL_RATIO"; status=1
              else
                echo "OK:   $file check failures $fails/$total within ratio $MAX_CHECK_FAIL_RATIO"
              fi
            fi
          }
          gate k6-single.json "$MIN_SINGLE_RPS"
          gate k6-steady.json "$MIN_STEADY_RPS"
          exit $status

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webserver-benchmark-results
          path: |
            demo/webserver/k6-single.json
            demo/webserver/k6-steady.json
