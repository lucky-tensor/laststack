name: demo-webserver

on:
  push:
    branches: [master, ci/demo-verification]
  pull_request:
    branches: [master]
  schedule:
    - cron: '42 3 * * *' # Nightly at 03:42 UTC
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang llvm lld curl jq

      - name: Build and Verify
        working-directory: demo/webserver
        run: |
          bash build.sh

      - name: Test Server Response
        working-directory: demo/webserver
        run: |
          bash webserver-evidence.sh --bin ./alienstack-server --json webserver-evidence-report.json

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webserver-reports
          path: |
            demo/webserver/verification-report.json
            demo/webserver/link-gate-report.json
            demo/webserver/effect-lint-report.json
            demo/webserver/webserver-evidence-report.json
            demo/webserver/artifacts/manifest.json
