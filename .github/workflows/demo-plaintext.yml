name: demo-plaintext

on:
  push:
    branches: [master, ci/demo-verification]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 3 * * *' # Nightly at 03:17 UTC
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang build-essential curl

      - name: Build and Verify
        working-directory: demo/plaintext
        run: |
          bash build.sh

      - name: Test Server Response
        working-directory: demo/plaintext
        run: |
          bash plaintext-evidence.sh --bin ./alienstack-plaintext --json plaintext-evidence-report.json

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plaintext-reports
          path: |
            demo/plaintext/verification-report.json
            demo/plaintext/link-gate-report.json
            demo/plaintext/effect-lint-report.json
            demo/plaintext/plaintext-evidence-report.json
